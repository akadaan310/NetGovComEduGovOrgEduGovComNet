name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acsp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ACSP_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/acsp_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run harness -- --db postgres
      - name: Migrations apply cleanly and idempotently
        run: |
          DATABASE_URL=$ACSP_TEST_DATABASE_URL npm run db:migrate
          DATABASE_URL=$ACSP_TEST_DATABASE_URL npm run db:migrate
      - run: npm run build
